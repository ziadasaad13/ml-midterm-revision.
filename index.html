<style>
:root{--bg:#f3f5fc;--card:#fff;--ink:#141a33;--mut:#66709a;--line:#e3e8f6;--pri:#5b4bff;--pri2:#00b8d9;--ok:#0f9d58;--okbg:#e4f7ec;--bad:#d93040;--badbg:#fdeaec;--warn:#a8680c;--warnbg:#fff4dc;--sh:0 8px 28px rgba(40,50,130,.09);--nav:rgba(255,255,255,.88);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.8;font-size:16px;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#4f3df5 0%,#7a4bff 45%,#00b8d9 100%);color:#fff;padding:22px 16px 70px;text-align:center}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero:before{width:220px;height:220px;top:-90px;inset-inline-start:-60px}.hero:after{width:160px;height:160px;bottom:-70px;inset-inline-end:-30px}
.hero h1{margin:0;font-size:25px;font-weight:800;position:relative}.hero p{margin:4px 0 0;opacity:.92;font-size:14px;position:relative}
.theme{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));inset-inline-end:12px;border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:12px;width:38px;height:38px;font-size:18px;cursor:pointer;z-index:2}
.stats{display:flex;gap:10px;max-width:860px;margin:-46px auto 0;padding:0 12px;position:relative}
.stat{flex:1;background:var(--card);border-radius:16px;box-shadow:var(--sh);text-align:center;padding:10px 4px;border:1px solid var(--line)}
.stat b{display:block;font-size:22px;color:var(--pri);line-height:1.2;font-weight:800}.stat span{font-size:12px;color:var(--mut)}
main{max-width:860px;margin:0 auto;padding:6px 12px 20px}
.page{display:none}.page.on{display:block;animation:f .3s}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.tabs{position:fixed;bottom:0;inset-inline:0;z-index:50;background:var(--nav);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;max-width:160px;border:0;background:transparent;color:var(--mut);font:700 11.5px 'Cairo',sans-serif;padding:4px 2px;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0}
.tabs button i{font-style:normal;font-size:22px;line-height:1.3;transition:transform .2s}
.tabs button.on{color:var(--pri)}.tabs button.on i{transform:translateY(-2px) scale(1.15)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:16px;margin:12px 0}
h2{font-size:19px;margin:0 0 6px;font-weight:800}h3{font-size:16px;margin:0 0 6px;font-weight:800}
.sub{color:var(--mut);font-size:13.5px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 13.5px 'Cairo',sans-serif;border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap;transition:.15s}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 6px 16px rgba(91,75,255,.35)}
.lhead{border-radius:20px;color:#fff;padding:18px;margin:10px 0;position:relative;overflow:hidden}
.lhead .num{position:absolute;inset-inline-end:10px;top:-14px;font-size:96px;font-weight:800;opacity:.16;line-height:1}
.lhead h2{color:#fff;font-size:20px;margin:0}.lhead p{margin:8px 0 0;font-size:15px;background:rgba(255,255,255,.18);border-radius:12px;padding:8px 12px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 8px;margin:10px 0;border-inline-start:5px solid var(--lc,var(--pri))}
.sec h3{color:var(--lc,var(--pri))}.sec ul{margin:6px 0;padding-inline-start:18px}.sec li{margin:7px 0}
.en{direction:ltr;unicode-bidi:isolate;font-family:-apple-system,'Segoe UI',sans-serif;font-weight:700;color:var(--lc,var(--pri))}
.f{direction:ltr;unicode-bidi:isolate;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:1px 8px;font-family:ui-monospace,Menlo,monospace;font-size:13.5px;display:inline-block;margin:1px 0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin:8px 0}
.fgrid .f{display:block;text-align:center;padding:10px;border-radius:12px;background:var(--card);border:1.5px dashed var(--lc,var(--pri))}
.trap{background:var(--badbg);border:1px solid var(--bad);color:var(--ink);border-radius:16px;padding:12px 14px;margin:10px 0}
.trap h3{color:var(--bad)}.trap ul{margin:4px 0;padding-inline-start:18px}
.cta{display:block;width:100%;border:0;border-radius:16px;padding:14px;font:800 16px 'Cairo',sans-serif;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));cursor:pointer;margin:12px 0;box-shadow:0 10px 24px rgba(91,75,255,.3)}
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:10;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:10px 12px;margin:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:700}
.prog{flex:1;min-width:80px;height:9px;background:var(--line);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .35s}
.mini{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;font:700 12px 'Cairo',sans-serif;padding:5px 10px;cursor:pointer}
.q{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;box-shadow:var(--sh);transition:border-color .2s}
.q.done.right{border-color:var(--ok)}.q.done.wrong{border-color:var(--bad)}
.q .h{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut);margin-bottom:8px;font-weight:700}
.q .h b{background:var(--pri);color:#fff;border-radius:9px;padding:0 9px;font-size:13px}
.q .h em{font-style:normal;background:var(--bg);border-radius:8px;padding:0 8px}
.q .t{font-weight:700;direction:ltr;text-align:left;unicode-bidi:plaintext;margin-bottom:10px;font-size:16.5px;line-height:1.6}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;direction:ltr;unicode-bidi:plaintext;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:13px;padding:10px 12px;margin:8px 0;font:600 15px/1.5 'Cairo',-apple-system,sans-serif;cursor:pointer;transition:.12s}
.o .l{flex:0 0 26px;height:26px;border-radius:8px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--mut)}
.o:active{transform:scale(.985)}.q.done .o{cursor:default}
.o.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}.o.ok .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.o.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}.o.bad .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.fb{display:none;margin-top:8px;border-radius:13px;padding:10px 12px;font-size:14px;font-weight:700}
.q.done .fb{display:block;animation:f .25s}.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.fb .why{color:var(--ink);margin-top:6px;font-weight:600;line-height:1.7}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:6px 10px;margin-top:6px;font-size:13px;font-weight:600}
.res{text-align:center}.ring{width:120px;height:120px;border-radius:50%;margin:6px auto;display:grid;place-items:center;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--line) 0)}
.ring span{width:94px;height:94px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:28px;font-weight:800;color:var(--pri)}
.cmp{margin:14px 0}.cmp h3{display:flex;gap:6px;align-items:center}
.tw{overflow-x:auto;border-radius:14px;border:1px solid var(--line);margin:6px 0;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px;direction:ltr}
th{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:9px;text-align:left;font-weight:700;white-space:nowrap}
td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}td:first-child{font-weight:800;color:var(--pri)}
tr:last-child td{border-bottom:0}
.tip{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:8px 12px;margin:6px 0;font-size:13.5px;font-weight:600}
.search{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;font:700 15px 'Cairo',sans-serif;margin:8px 0}
.term{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0;border-inline-start:4px solid var(--pri2)}
.term .e{direction:ltr;text-align:left;font-weight:800;color:var(--pri)}.term small{color:var(--mut);font-weight:700}
footer{text-align:center;color:var(--mut);padding:18px 12px;font-size:14px}
footer b{display:block;font-size:20px;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
</style>

 to the lecture, the hypothesis hθ(x) represents:", "o": ["p(y = 1 | x; θ)", "p(x = 1 | y; θ)", "The number of observations", "The log of the likelihood"], "a": 0, "tag": "Lecture 4"}, {"t": "mc", "q": "What does MLE stand for?", "o": ["Maximum Linear Estimation", "Maximum Likelihood Estimation", "Minimum Likelihood Error", "Multiple Logistic Evaluation"], "a": 1, "tag": "Lecture 4"}, {"t": "mc", "q": "What is the first step of Maximum Likelihood Estimation in the lecture?", "o": ["Maximize L(θ) immediately", "Get the probability for all observations", "Differentiate the cost function", "Choose a learning rate"], "a": 1, "tag": "Lecture 4"}, {"t": "mc", "q": "In the second MLE step, the likelihood is expressed as a function of θ while which quantities are fixed?", "o": ["Only θ", "X and y", "Only the predicted probabilities", "The number of features and classes"], "a": 1, "tag": "Lecture 4"}, {"t": "mc", "q": "The likelihood function in the lecture is written as:", "o": ["L(θ) = p(y | X; θ)", "L(θ) = xθ", "L(θ) = 1 − p", "L(θ) = log(x)"], "a": 0, "tag": "Lecture 4"}, {"t": "mc", "q": "What is the third step of MLE?", "o": ["Minimize the number of features", "Maximize L(θ)", "Set every y value to 0", "Take the square root of the odds"], "a": 1, "tag": "Lecture 4"}, {"t": "mc", "q": "How can the likelihood function be simplified before finding its gradient?", "o": ["By taking its logarithm", "By converting it to a scatter plot", "By subtracting X from y", "By restricting θ to [0,1]"], "a": 0, "tag": "Lecture 4"}, {"t": "mc", "q": "After taking the log of the likelihood, what does the lecture say to do next?", "o": ["Differentiate to get the gradient", "Round all probabilities", "Remove the observations", "Calculate the odds only"], "a": 0, "tag": "Lecture 4"}, {"t": "mc", "q": "Which statement best describes the role of the sigmoid function in logistic regression?", "o": ["It maps a real-valued input to a probability value", "It maps probabilities to class names directly in every case", "It calculates the number of training examples", "It removes the need for model parameters Write True or False for each statement."], "a": 0, "tag": "Lecture 4"}, {"t": "tf", "q": "Classification predicts values from a small set of discrete possibilities.", "a": true, "tag": "Lecture 4"}, {"t": "tf", "q": "Email spam detection is presented as an example of classification.", "a": true, "tag": "Lecture 4"}, {"t": "tf", "q": "Binary logistic regression uses output labels that may be any real number.", "a": false, "tag": "Lecture 4"}, {"t": "tf", "q": "The odds are calculated as p divided by 1 − p.", "a": true, "tag": "Lecture 4"}, {"t": "tf", "q": "The quantity 1 − p is the probability that the event occurs.", "a": false, "tag": "Lecture 4"}, {"t": "tf", "q": "Taking the log of the odds maps the probability range to the entire real number line.", "a": true, "tag": "Lecture 4"}, {"t": "tf", "q": "The sigmoid function shown in the lecture is 1 / (1 + e^(−θᵀx)).", "a": true, "tag": "Lecture 4"}, {"t": "tf", "q": "The hypothesis hθ(x) is defined as p(y = 1 | x; θ).", "a": true, "tag": "Lecture 4"}, {"t": "tf", "q": "In MLE, X and y are treated as fixed when expressing L as a function of θ.", "a": true, "tag": "Lecture 4"}, {"t": "tf", "q": "The final step of MLE described in the lecture is to minimize L(θ).", "a": false, "tag": "Lecture 4"}, {"t": "tf", "q": "The lecture suggests taking the log of L(θ) and differentiating to obtain the gradient.", "a": true, "tag": "Lecture 4"}, {"t": "tf", "q": "A malignant/benign tumor example is included among the classification examples.", "a": true, "tag": "Lecture 4"}]}, {"name": "Lecture 5", "set": [{"t": "mc", "q": "What is the main goal of a Support Vector Machine for a linearly separable binary dataset?", "o": ["To create clusters of similar points", "To find a hyperplane with the maximum margin", "To minimize the number of features", "To predict continuous values"], "a": 1, "tag": "Lecture 5"}, {"t": "mc", "q  price of a house, is an example of which type of ML task?", "o": ["Classification", "Regression", "Clustering", "Transcription"], "a": 1, "tag": "Mini Exam"}, {"t": "mc", "q": "Optical Character Recognition (OCR), where a system observes an image of text and returns it in discrete, textual form, is an example of:", "o": ["Machine Translation", "Regression", "Transcription", "Reinforcement Learning"], "a": 2, "tag": "Mini Exam"}, {"t": "mc", "q": "Which type of machine learning involves training an algorithm on data *without* explicit labels, aiming to find hidden patterns or structures?", "o": ["Supervised Learning", "Unsupervised Learning", "Reinforcement Learning", "Semi-supervised Learning"], "a": 1, "tag": "Mini Exam"}, {"t": "mc", "q": "An AI agent learning to play chess by receiving rewards for good moves and penalties for bad moves is using:", "o": ["Supervised Learning", "Unsupervised Learning", "Reinforcement Learning", "K-Means Clustering"], "a": 2, "tag": "Mini Exam"}, {"t": "mc", "q": "The individual measurable properties or characteristics of a dataset, such as 'square footage' or 'number of bedrooms' in a housing dataset, are called:", "o": ["Labels", "Features", "Datasets", "Targets"], "a": 1, "tag": "Mini Exam"}, {"t": "mc", "q": "In the ML workflow, the step that involves cleaning data, handling missing values, and normalizing features is called:", "o": ["Data Collection", "Model Selection", "Data Preprocessing", "Model Deployment"], "a": 2, "tag": "Mini Exam"}, {"t": "mc", "q": "When a model learns the noise in the training data rather than the underlying pattern and performs poorly on unseen data, this challenge is known as:", "o": ["Underfitting", "Overfitting", "Data Dependency", "Interpretability"], "a": 1, "tag": "Mini Exam"}, {"t": "mc", "q": "K-Means Clustering and PCA are common algorithms for which type of learning?", "o": ["Supervised Learning", "Reinforcement Learning", "Unsupervised Learning", "Semi-supervised Learning"], "a": 2, "tag" ", "Processes all features in a batch."], "a": 2, "tag": "Mini Exam"}, {"t": "mc", "q": "If you have features on vastly different scales (e.g., x_1 = size 0-2000, x_2 = bedrooms 1-5), what technique is recommended to help gradient descent converge?", "o": ["Feature Scaling (e.g., Mean Normalization)", "Polynomial Regression", "Increasing the learning rate (α)", "Using the \"Batch\" method"], "a": 0, "tag": "Mini Exam"}, {"t": "mc", "q": "If your cost function J(θ) is *increasing* with each iteration, the most likely cause is:", "o": ["The learning rate α is too small.", "The learning rate α is too large.", "The model has converged.", "The data is perfectly normalized."], "a": 1, "tag": "Mini Exam"}, {"t": "mc", "q": "Logistic Regression is used for classification, and it models the probability p(y=1|x;θ) using what type of function?", "o": ["A linear function", "A polynomial function", "A step function", "A standard logistic (sigmoid) function"], "a": 3, "tag": "Mini Exam"}, {"t": "mc", "q": "In Support Vector Machines (SVM), the data points that lie closest to the separating hyperplane and define the margin are called:", "o": ["Support Vectors", "Margin Vectors", "Optimal Points", "Kernel Points"], "a": 0, "tag": "Mini Exam"}, {"t": "mc", "q": "The \"kernel trick\" in SVMs is used to:", "o": ["Reduce the number of support vectors.", "Map data into a higher-dimensional space to make it linearly separable.", "Speed up the calculation of the L2 penalty.", "Choose the optimal learning rate α."], "a": 1, "tag": "Mini Exam"}, {"t": "tf", "q": "In Machine Learning, \"Experience\" (E) refers to the task (T) the program is trying to solve.", "a": false, "tag": "Mini Exam"}, {"t": "tf", "q": "A 'Regression' task involves predicting a discrete category, such as 'spam' or 'not spam'.", "a": false, "tag": "Mini Exam"}, {"t": "tf", "q": "In the ML workflow, \"Model Deployment\" is the step that comes *before* \"Model Evaluation\".", "a": false, "tag": "Mini Exam"}, {"t": "tf", " hat are farthest away from the hyperplane.", "a": false, "tag": "Mini Exam"}, {"t": "tf", "q": "Random Forest Regression is an ensemble method that reduces overfitting by averaging the predictions of multiple decision trees.", "a": true, "tag": "Mini Exam"}, {"t": "tf", "q": "Lasso (L1) regression is identical to Ridge (L2) regression, except it is computationally faster.", "a": false, "tag": "Mini Exam"}, {"t": "tf", "q": "In the notation x_j⁽ⁱ⁾, the j refers to the j-th feature and i refers to the i-th training example.", "a": true, "tag": "Mini Exam"}], "desc": "بنك شامل لكل المنهج."}], "lectures": [{"n": "1", "ic": "🧠", "c": "#6c5ce7", "title": "Introduction to ML", "bank": 0, "idea": "الـ <span class=\"en\">Machine Learning<\/span> بدل ما أكتب قواعد لكل حالة، بديّ الكمبيوتر <b>أمثلة (داتا)<\/b> ويطلع القواعد بنفسه.", "secs": [["ايه هو الـ ML؟", ["فرع من الـ <span class=\"en\">AI<\/span> بيخلّي النظام يتعلم من الداتا ويتحسن بالخبرة من غير ما نبرمجه لكل مهمة لوحدها.", "<span class=\"en\">Traditional<\/span>: <span class=\"f\">Program + Data → Output<\/span> &nbsp;|&nbsp; <span class=\"en\">ML<\/span>: <span class=\"f\">Data + Output → Program (Model)<\/span>", "تعريف <b>Tom Mitchell<\/b>: البرنامج بيتعلم من <span class=\"en\">Experience (E)<\/span> بخصوص <span class=\"en\">Task (T)<\/span> و<span class=\"en\">Performance (P)<\/span> لو أداؤه على T مقاسًا بـ P بيتحسن مع E. <br><i>مثال سبام:<\/i> T = تصنيف الإيميلات · E = إيميلات متعلّم عليها · P = نسبة التصنيف الصح."]], ["الـ Tasks الأساسية", ["<span class=\"en\">Classification<\/span>: يحدد فئة (Good/Bad risk، Spam/Not spam).", "<span class=\"en\">Regression<\/span>: يطلّع رقم مستمر (سعر بيت).", "<span class=\"en\">Transcription<\/span>: يحوّل صورة نص لنص رقمي (<b>OCR<\/b>). <span class=\"en\">Machine Translation<\/span>: ترجمة لغة للغة. <span class=\"en\">Clustering<\/span>: تجميع من غير labels."]], ["أنواع التعلم", ["<span class=\"en\">Supervised<\/span>: داتا بـ labels (معلّم بيصحّح). <span class=\"en\">Unsupervised<\/span>: من غير labels بيكتشف structure (k-Means, PCA).", "<span class=\"en\">Semi-supervised<\/span>: جزء صغير labeled + كتير unlabeled. <span class=\"en\">Reinforcement<\/span>: agent بيجرّب ويتاخد reward/penalty من الـ environment."]], ["مصطلحات أساسية", ["<span class=\"en\">Feature<\/span> = خاصية (مساحة، غرف) · <span class=\"en\">Label/Target<\/span> = المطلوب توقعه · <span class=\"en\">Example<\/span> = صف في الداتا · <span class=\"en\">Dataset<\/span> = مجموعة الأمثلة.", "<span class=\"en\">Accuracy<\/span> = الصح ÷ الكل · <span class=\"en\">Error rate<\/span> = 1 − Accuracy. (90 من 100 → 90% و 10%)."]], ["الـ Workflow", ["<span class=\"en\">Data Collection<\/span> → <span class=\"en\">Preprocessing<\/span> (cleaning, missing, normalize, encode) → <span class=\"en\">Model Selection<\/span> → <span class=\"en\">Training<\/span> → <span class=\"en\">Evaluation<\/span> → <span class=\"en\">Tuning<\/span> → <span class=\"en\">Deployment<\/span>.", "التحديات: Overfitting · Underfitting · داتا قليلة أو biased · Interpretability · الاعتماد على كمية داتا كبيرة."]]], "formulas": ["<span class=\"f\">Accuracy = Correct / Total<\/span>", "<span class=\"f\">Error = 1 − Accuracy<\/span>"], "traps": ["الـ <b>Experience (E)<\/b> هي الداتا، مش الـ Task.", "الـ <b>Deployment<\/b> بعد الـ Evaluation، مش قبله ومش هو التدريب.", "داتا biased ≠ موديل عادل وموثوق."]}, {"n": "2", "ic": "🎯", "c": "#0984e3", "title": "Supervised Learning Fundamentals", "bank": 1, "idea": "الموديل بيشوف <b>input + الإجابة الصح<\/b> ويتعلم الدالة اللي بتربطهم، علشان يتوقع على داتا جديدة.", "secs": [["Regression vs Classification", ["<span class=\"en\">Regression<\/span>: output <span class=\"en\">continuous<\/span> (درجة حرارة، سعر). <span class=\"en\">Classification<\/span>: output <span class=\"en\">discrete<\/span> إما <span class=\"en\">Binary<\/span> (فئتين) أو <span class=\"en\">Multi-class<\/span> (أكتر).", "الخوارزميات: <span class=\"en\">Linear Reg.<\/span> · <span class=\"en\">Logistic Reg.<\/span> (للتصنيف رغم اسمها) · <span class=\"en\">k-NN<\/span> · <span class=\"en\">SVM<\/span> · <span class=\"en\">Decision Trees<\/span>."]], ["k-NN", ["بيبص على أقرب <b>k<\/b> جيران. Classification = <b>majority vote<\/b>، Regression = <b>average<\/b>. هو <span class=\"en\">non-parametric<\/span>.", "<b>k صغير<\/b> → حساس للـ noise → <span class=\"en\">overfitting<\/span>. <b>k كبير<\/b> → موديل بسيط زيادة → <span class=\"en\">underfitting<\/span>. Distance الشائع: <span class=\"en\">Euclidean<\/span> (خط مستقيم)."]], ["Bias / Variance", ["<span class=\"en\">High bias<\/span> = بسيط زيادة = <span class=\"en\">underfitting<\/span> (وحش على train و test). <span class=\"en\">High variance<\/span> = حساس زيادة = <span class=\"en\">overfitting<\/span> (كويس على train ووحش على الجديد).", "الحل بيبقى توازن: مش بسيط ومش معقد (Bias–Variance tradeoff)."]], ["تقسيم الداتا", ["<span class=\"en\">Training<\/span>: بيتعلم الـ parameters. <span class=\"en\">Validation<\/span>: ضبط الـ hyperparameters (تأثيره غير مباشر). <span class=\"en\">Test<\/span>: التقييم النهائي <b>مرة واحدة<\/b> ومتتعدلش بيه الموديل."]], ["Cross-Validation", ["<span class=\"en\">Holdout<\/span>: split واحد · <span class=\"en\">k-Fold<\/span>: k أجزاء، كل جزء validation مرة والباقي train · <span class=\"en\">Stratified k-Fold<\/span>: نفس نسب الـ classes في كل fold (مهم مع الـ imbalanced) · <span class=\"en\">Repeated random subsampling<\/span> = <span class=\"en\">Monte Carlo<\/span> CV."]], ["Cost & Gradient Descent", ["الـ <span class=\"en\">Cost<\/span> بيقيس الفرق بين التوقع والحقيقة. <span class=\"en\">GD<\/span> بينزل في اتجاه الـ negative gradient. α صغير = بطيء · α كبير = overshoot.", "<span class=\"en\">MSE<\/span> للـ regression (بيعاقب الأخطاء الكبيرة أكتر من MAE) · <span class=\"en\">Cross-Entropy<\/span> للـ classification · <span class=\"en\">Hinge<\/span> للـ SVM."]], ["Evaluation Metrics", ["<span class=\"en\">Precision<\/span>: من اللي قلت عليه positive كام صح؟ · <span class=\"en\">Recall<\/span>: من كل الـ positives الحقيقية كام لقيت؟ · <span class=\"en\">F1<\/span>: harmonic mean بينهم. <br>المثال: 1000 ملف، 200 relevant، رجّع 150 صح + 100 غلط → Recall = 150/200 = <b>0.75<\/b> و Precision = 150/250 = 0.6."]]], "formulas": ["<span class=\"f\">θ := θ − α·∂J/∂θ<\/span>", "<span class=\"f\">Precision = TP/(TP+FP)<\/span>", "<span class=\"f\">Recall = TP/(TP+FN)<\/span>", "<span class=\"f\">F1 = 2PR/(P+R)<\/span>"], "traps": ["الـ <b>training set<\/b> مش بتضبط الـ hyperparameters، ده دور الـ validation.", "الـ <b>test set<\/b> مش بتتستخدم كتير أثناء التدريب.", "الـ <b>Holdout<\/b> مش مناسب لكل الـ imbalanced datasets.", "MSE للـ <b>regression<\/b> مش classification."]}, {"n": "3", "ic": "📈", "c": "#00b894", "title": "Regression (One var · Multi var · Algorithms)", "bank": 2, "idea": "بدوّر على أحسن خط/منحنى يقلل الخطأ بين اللي الموديل يتوقعه واللي حصل فعلًا.", "secs": [["Linear Regression بمتغير واحد", ["<span class=\"f\">hθ(x) = θ₀ + θ₁x<\/span>: θ₀ = <span class=\"en\">intercept<\/span> (القيمة لما x=0)، θ₁ = <span class=\"en\">slope<\/span>. المتغير المتوقّع اسمه <span class=\"en\">dependent / target<\/span>.", "<span class=\"en\">Cost<\/span>: <span class=\"f\">J(θ) = 1/2m · Σ(hθ(x⁽ⁱ⁾) − y⁽ⁱ⁾)²<\/span>. الـ (i) = رقم الـ example، والـ (j) = رقم الـ feature."]], ["Multiple Variables", ["<span class=\"f\">hθ(x) = θ₀x₀ + θ₁x₁ + … + θₙxₙ = θᵀx<\/span> مع x₀ = 1.", "الـ <span class=\"en\">Gradient Descent<\/span>: تحديث كل θⱼ <b>simultaneously<\/b> بالقيم القديمة. <span class=\"en\">Batch GD<\/span> = كل الأمثلة في كل update. لو J بتزيد → α كبير.", "<span class=\"en\">Feature Scaling / Mean Normalization<\/span> لما الـ features بمقاييس مختلفة (0–2000 مقابل 1–5) علشان الـ GD يـ converge أسرع.", "بديل: <span class=\"en\">Normal Equation<\/span> <span class=\"f\">θ=(XᵀX)⁻¹Xᵀy<\/span> مفيهوش α ومفيهوش iterations بس بطيء مع n كبير."]], ["OLS والـ Assumptions", ["<span class=\"en\">OLS<\/span> بيقلل مجموع مربعات الـ <span class=\"en\">residuals<\/span> (= Observed − Predicted).", "الـ assumptions: <b>Linearity · Independence · Homoscedasticity<\/b> (variance ثابت للأخطاء) · <b>Normality<\/b> of errors.", "المقاييس: <span class=\"en\">MSE<\/span> (متوسط مربعات الأخطاء) · <span class=\"en\">R²<\/span> (قد إيه الـ features بتفسّر الـ variance)."]], ["عيلة الـ Regression", ["<span class=\"en\">Polynomial<\/span>: بيلتقط non-linear trend بس <b>لسه linear في الـ parameters<\/b>؛ درجة عالية = overfit.", "<span class=\"en\">Ridge (L2)<\/span>: penalty على الـ large coefficients، يصغّرها ومبيصفّرش، كويس مع multicollinearity. <span class=\"en\">Lasso (L1)<\/span>: يصفّر coefficients = feature selection. <span class=\"en\">Elastic Net<\/span> = L1 + L2.", "<span class=\"en\">SVR<\/span>: يقبل انحراف ε. <span class=\"en\">Decision Tree Reg.<\/span>: بيقسّم الداتا recursive (بيعمل overfit لو عميق). <span class=\"en\">Random Forest<\/span>: average لشجر كتير. <span class=\"en\">Bayesian<\/span>: بيدخّل prior beliefs."]]], "formulas": ["<span class=\"f\">hθ(x) = θ₀ + θ₁x<\/span>", "<span class=\"f\">J(θ) = 1/2m Σ(h − y)²<\/span>", "<span class=\"f\">θ = (XᵀX)⁻¹Xᵀy<\/span>", "<span class=\"f\">Residual = y − ŷ<\/span>"], "traps": ["Polynomial regression <b>مش<\/b> non-linear في الـ parameters.", "Ridge <b>مبيصفّرش<\/b> coefficients، Lasso هو اللي بيصفّر.", "من assumptions الـ linear regression: Independence، <b>مش<\/b> non-linear separability.", "Linear regression مش للـ classification."]}, {"n": "4", "ic": "🔀", "c": "#e17055", "title": "Logistic Regression", "bank": 3, "idea": "بتاخد معادلة خطية وتمرّرها على <span class=\"en\">Sigmoid<\/span> فتطلع <b>احتمال<\/b> بين 0 و 1، وعلى أساسه نصنّف.", "secs": [["الفكرة", ["اسمها regression بس هي <span class=\"en\">Classification<\/span>. الـ output في الـ binary هو <b>0 أو 1<\/b> فقط (spam / tumor malignant).", "الـ <span class=\"en\">Hypothesis<\/span>: <span class=\"f\">hθ(x) = 1/(1+e^(−θᵀx))<\/span> وبتمثّل <span class=\"f\">p(y=1|x;θ)<\/span>. لو hθ(x) ≥ 0.5 → class 1."]], ["Odds و const NOTES=[["sigmoid|logistic function|0 and 1", "الـ <span class=\"en\">Sigmoid<\/span> = 1/(1+e^−z) بتحوّل أي رقم لاحتمال بين 0 و 1. دي قلب الـ <span class=\"en\">Logistic Regression<\/span>، والـ threshold العادي 0.5."], ["odds|log.?odds|logit", "<span class=\"en\">Odds = p/(1−p)<\/span>. والـ <span class=\"en\">log-odds (logit)<\/span> بيشيل قيد المدى (0..1) ويخلّي القيمة من −∞ لـ +∞ فنقدر نربطها بمعادلة خطية."], ["MLE|likelihood", "<span class=\"en\">MLE<\/span>: بنـ <b>maximize<\/b> الـ likelihood L(θ) (مش minimize). X و y ثابتين، θ هي المتغير. وبناخد log ونعمل derivative لحساب الـ gradient."], ["kernel|infinite|higher.?dimension", "<span class=\"en\">Kernel trick<\/span>: بيعمل mapping للداتا لـ <b>higher-dimensional space<\/b> علشان تبقى linearly separable. الأنواع: Linear, Polynomial, RBF (RBF = infinite-dimensional)."], ["support vector|closest to the (separating )?hyperplane", "الـ <span class=\"en\">Support Vectors<\/span> هي النقط الأقرب للـ hyperplane وهي اللي بتحدد الـ margin، مش الأبعد."], ["margin|hyperplane", "هدف الـ <span class=\"en\">SVM<\/span>: hyperplane بـ <b>maximum margin<\/b>. الـ margin = 2/‖w‖ فـ maximize margin = minimize ½‖w‖² (Quadratic problem بـ linear constraints)."], ["penalty term|slack|misclassif", "في الداتا اللي مش linearly separable بنضيف <span class=\"en\">penalty term (slack)<\/span> علشان نسمح ونعاقب الـ misclassified points."], ["lagrange", "<span class=\"en\">Lagrange multipliers<\/span> (α ≥ 0) بتدخّل الـ constraints جوه الـ objective function في مسألة الـ SVM."], ["lasso|L1|feature selection|to exactly zero", "<span class=\"en\">Lasso (L1)<\/span> بيصفّر بعض الـ coefficients فيعمل <b>feature selection<\/b>. أما <span class=\"en\">Ridge (L2)<\/span> بيصغّر بس ومبيصفّرش."], ["ridge|L2", "<span class=\"en\">Ridge (L2)<\/span> بيضيف penalty على الـ <b>large coefficients<\/b> علشان يقلل الـ overfitting، ومبيوصّلش أي coefficient لصفر."], ["elastic", "<span class=\"en\">Elastic Net<\/span> = Lasso + Ridge (L1 + L2)، كويس مع الـ correlated features."], ["overfit|learns? (the )?noise|too well", "<span class=\"en\">Overfitting<\/span>: الموديل بيحفظ الـ noise: أداء ممتاز على train ووحش على الجديد (high variance). الحل: regularization, more data, cross-validation."], ["underfit|too simple|high bias", "<span class=\"en\">Underfitting<\/span>: الموديل بسيط زيادة (high bias) فوحش على train و test."], ["variance", "<span class=\"en\">High variance<\/span> = حساس جدًا لتغيّرات صغيرة في الداتا = overfitting."], ["stratified", "<span class=\"en\">Stratified k-Fold<\/span> بيحافظ على نسبة كل class في كل fold، ومفيد مع الـ imbalanced data."], ["k-?fold|cross.?validation", "<span class=\"en\">k-Fold CV<\/span>: بنقسم لـ k folds، وكل fold بيبقى validation مرة واحدة والباقي train، وبناخد متوسط النتيجة."], ["validation", "<span class=\"en\">Validation set<\/span> لضبط الـ hyperparameters (تأثيره غير مباشر). و<span class=\"en\">Test set<\/span> للتقييم النهائي مرة واحدة بس."], ["precision", "<span class=\"en\">Precision = TP/(TP+FP)<\/span> يعني من اللي توقعته positive كام صح."], ["recall", "<span class=\"en\">Recall = TP/(TP+FN)<\/span> يعني من كل الـ positives الحقيقية كام لقيت."], ["F1|harmonic", "<span class=\"en\">F1 = 2·P·R/(P+R)<\/span> هو الـ <b>harmonic mean<\/b> بين Precision و Recall."], ["MSE|squared", "<span class=\"en\">MSE<\/span> مقياس لـ regression (مش classification). والتربيع بيعاقب الأخطاء الكبيرة أكتر من MAE."], ["R-?squared|R²|variance in the dependent", "<span class=\"en\">R²<\/span> بيقيس الـ independent variables بتفسّر كام من الـ variance في الـ dependent variable."], ["cross.?entropy|hinge", "<span class=\"en\">Cross-Entropy<\/span> للـ classification، <span class=\"en\">MSE<\/span> للـ regression، و<span class=\"en\">Hinge<\/span> للـ SVM."], ["learning rate|alpha|α|overshoot|diverge", "<span class=\"en\">Learning rate α<\/span>: صغير → بطيء، كبير → overshoot / diverge. لو J(θ) بتزيد كل iteration يبقى α كبير."], ["gradient", "<span class=\"en\">Gradient Descent<\/span>: θ = θ − α·∇J. بينزل ناحية steepest descent، وكل الـ θ بتتحدّث <b>simultaneously<\/b>. Batch = كل الأمثلة في كل update."], ["feature scal|normaliz|standardiz", "<span class=\"en\">Feature scaling<\/span> بيخلّي الـ features في نطاق متقارب فالـ gradient descent يـ converge أسرع."], ["PCA|principal component|dimensionality", "<span class=\"en\">PCA<\/span> unsupervised، بيدوّر على اتجاهات أكبر variance، والـ components orthogonal، وبيقيس <b>perpendicular offset<\/b>. وعددها ≤ عدد الـ features."], ["eigen", "الـ <span class=\"en\">eigenvector<\/span> هو vector بيتغير بـ scalar بس لما نطبّق عليه التحويل، والـ eigenvalues هي جذور الـ characteristic polynomial."], ["k-?NN|nearest neighbor|\\bk\\b", "<span class=\"en\">k-NN<\/span>: k صغير → حساس للـ noise (overfit)، k كبير → underfit. في regression بناخد average الجيران، وفي classification بنعمل vote."], ["supervised|labeled", "<span class=\"en\">Supervised<\/span> = labeled data (input + correct output). <span class=\"en\">Unsupervised<\/span> = من غير labels (k-Means, PCA)."], ["reinforcement|reward|agent", "<span class=\"en\">Reinforcement Learning<\/span>: agent بيتعلم من الـ feedback (reward / penalty) من الـ environment."], ["regression|continuous", "<span class=\"en\">Regression<\/span> = بيتنبأ بقيمة <b>continuous<\/b>. <span class=\"en\">Classification<\/span> = بيتنبأ بـ <b>discrete<\/b> category."], ["polynomial", "<span class=\"en\">Polynomial regression<\/span> لسه linear في الـ parameters، لكن الدرجة العالية بتعمل overfitting."], ["OLS|least squares|sum of squared", "<span class=\"en\">OLS<\/span> بيـ minimize مجموع مربعات الأخطاء (residuals = actual − predicted)."], ["transcription|OCR", "<span class=\"en\">Transcription<\/span> زي OCR: بيحوّل صورة نص لنص رقمي."], ["hypothesis", "الـ <span class=\"en\">Hypothesis<\/span> hθ(x) = θ₀ + θ₁x هي دالة التنبؤ. θ₀ = intercept، θ₁ = slope."]];
function noteFor(x){const s=x.q+' '+(x.t==='mc'?x.o[x.a]:'');for(const [re,n] of NOTES)if(new RegExp(re,'i').test(s))return n;return''}

function quiz(root,set){
  const st={a:{},only:false};root.innerHTML='';
  const head=document.createElement('div');head.className='bar';head.innerHTML='<span class="sc"></span><div class="prog"><i></i></div><button class="mini wr">❌ غلطاتي</button><button class="mini rs">🔄 من الأول</button>';
  const list=document.createElement('div'),res=document.createElement('div');root.append(head,list,res);
  const upd=()=>{const n=Object.keys(st.a).length,c=Object.values(st.a).filter(v=>v).length;
    head.querySelector('.sc').textContent=`✅ ${c} / ${set.length}`;head.querySelector('.prog i').style.width=(n/set.length*100)+'%';
    if(n===set.length){const p=Math.round(c/set.length*100);res.innerHTML=`<div class="card res"><div class="ring" style="--p:${p}"><span>${p}%</span></div><h3>${c} من ${set.length} صح — ${p>=85?'ممتاز 🔥':p>=65?'كويس، راجع الغلطات 💪':'محتاج مراجعة تانية 📖'}</h3></div>`}else res.innerHTML=''};
  set.forEach((x,i)=>{
    const q=document.createElement('div');q.className='q';
    const opts=x.t==='tf'?['True','False']:x.o,right=x.t==='tf'?(x.a?0:1):x.a;
    q.innerHTML=`<div class="h"><b>${i+1}</b><em>${esc(x.tag||'')}</em><em>${x.t==='tf'?'True / False':'MCQ'}</em></div><div class="t">${esc(x.q)}</div>`+opts.map((o,j)=>`<button class="o" data-j="${j}"><span class="l">${x.t==='tf'?(j?'✗':'✓'):'ABCDEF'[j]}</span><span>${esc(o)}</span></button>`).join('')+'<div class="fb"></div>';
    q.querySelectorAll('.o').forEach(b=>b.onclick=()=>{
      if(q.classList.contains('done'))return;const ok=+b.dataset.j===right;st.a[i]=ok;
      q.classList.add('done',ok?'right':'wrong');q.querySelectorAll('.o')[right].classList.add('ok');if(!ok)b.classList.add('bad');
      const fb=q.querySelector('.fb'),nt=noteFor(x);fb.className='fb '+(ok?'ok':'bad');
      fb.innerHTML=(ok?'✅ إجابة صح!':'❌ غلط — الإجابة الصح: <span style="direction:ltr;unicode-bidi:isolate">'+esc(opts[right])+'</span>')+(nt?'<div class="why">💡 '+nt+'</div>':'')+(x.note?'<div class="note">⚠️ '+x.note+'</div>':'');
      upd()});
    list.appendChild(q)});
  head.querySelector('.rs').onclick=()=>{quiz(root,set);root.scrollIntoView()};
  head.querySelector('.wr').onclick=()=>{st.only=!st.only;[...list.children].forEach((q,i)=>{q.style.display=(st.only&&!(i in st.a&&!st.a[i]))?'none':''})};
  upd();
}
function picker(secId,groups,intro,extra){
  const sec=$('#'+secId);sec.innerHTML=`<div class="card"><h2>${intro[0]}</h2><div class="sub">${intro[1]}</div></div><div class="pills"></div><div class="body"></div>`;
  const pills=sec.querySelector('.pills'),body=sec.querySelector('.body');
  const all=[...groups];if(extra)all.push(extra);
  all.forEach((g,i)=>{const b=document.createElement('button');b.className='pill';b.textContent=g.rand?g.name:`${g.name} · ${g.set.length}`;
    b.onclick=()=>{pills.querySelectorAll('.pill').forEach(x=>x.classList.remove('on'));b.classList.add('on');
      let set=g.set;if(g.rand){const pool=groups.flatMap(x=>x.set);set=[...pool].sort(()=>Math.random()-.5).slice(0,20)}
      body.innerHTML=(g.desc?`<div class="card sub">${g.desc}</div>`:'')+'<div class="qz"></div>';quiz(body.querySelector('.qz'),set)};
    pills.appendChild(b);if(i===0)b.click()});
  sec.pick=i=>pills.children[i].click();
}
picker('exams',DATA.exams,['📝 امتحانات السنين اللي فاتت','اختار الامتحان وابدأ. أول ما تجاوب بيظهرلك الصح والغلط والتحليل.']);
picker('banks',DATA.banks,['🏦 بنوك الأسئلة لكل محاضرة','أسئلة كل محاضرة + بنك شامل + 🎲 اختبار عشوائي 20 سؤال من كل البنوك.'],{name:'🎲 عشوائي 20',rand:true,desc:'20 سؤال عشوائي من كل البنوك. اضغط عليه تاني لمجموعة جديدة.'});

let cur=0;
function lecture(i){cur=i;const l=DATA.lectures[i];const el=$('#lbody');
  el.style.setProperty('--lc',l.c);
  el.innerHTML=`<div class="lhead" style="background:linear-gradient(135deg,${l.c},${l.c}aa)"><div class="num">${l.n}</div><h2>${l.ic} ${l.title}</h2><p>🎯 ${l.idea}</p></div>`
  +l.secs.map((s,k)=>`<div class="sec"><h3>${k+1}. ${s[0]}</h3><ul>${s[1].map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')
  +`<div class="sec"><h3>🧮 المعادلات المهمة</h3><div class="fgrid">${l.formulas.join('')}</div></div>`
  +`<div class="trap"><h3>🚨 فخاخ الامتحان</h3><ul>${l.traps.map(x=>`<li>${x}</li>`).join('')}</ul></div>`
  +`<button class="cta" onclick="goBank(${l.bank})">🏦 حل أسئلة المحاضرة ${l.n}</button>`;
  document.querySelectorAll('#lp .pill').forEach((p,k)=>p.classList.toggle('on',k===i))}
function goBank(i){location.hash='banks';$('#banks').pick(i)}
$('#summary').innerHTML=`<div class="card"><h2>👋 ازاي تذاكر من هنا؟</h2><div class="sub">اقرأ المحاضرة هنا، وبعدها اضغط على زرار الأسئلة تحت. قبل الامتحان بيوم: حل الامتحانات القديمة وراجع المقارنات.</div></div><div class="pills" id="lp">`+DATA.lectures.map((l,i)=>`<button class="pill" onclick="lecture(${i})">${l.ic} L${l.n}</button>`).join('')+`</div><div id="lbody"></div>`;
lecture(0);

const cats=[...new Set(DATA.compare.map(c=>c.cat))],tcats=[...new Set(DATA.terms.map(t=>t[0]))];
const CN={Learning:'🎓 التعلم',Fitting:'⚖️ Fitting',Data:'🗂️ الداتا',Models:'🤖 الموديلات',Optimization:'📉 Optimization',Evaluation:'📏 التقييم'};
$('#terms').innerHTML=`<div class="card"><h2>⚖️ المقارنات والفروق</h2><div class="sub">${DATA.compare.length} مقارنة مقسّمة حسب الموضوع.</div></div><div class="pills" id="cp"></div><div id="cl"></div><div class="card"><h2>🔤 قاموس المصطلحات</h2><input class="search" id="ts" placeholder="🔎 دوّر على مصطلح…" dir="auto"></div><div class="pills" id="tp"></div><div id="tl"></div>`;
let cc='All',tc='All';
const mk=(box,list,get,on)=>{box.innerHTML='';['All',...list].forEach(c=>{const b=document.createElement('button');b.className='pill'+(c==='All'?' on':'');b.textContent=c==='All'?'الكل':get(c);b.onclick=()=>{box.querySelectorAll('.pill').forEach(x=>x.classList.remove('on'));b.classList.add('on');on(c)};box.appendChild(b)})};
const drawC=()=>{$('#cl').innerHTML=DATA.compare.filter(c=>cc==='All'||c.cat===cc).map(c=>`<div class="cmp"><h3>🔹 ${c.t}</h3><div class="tw"><table><tr>${c.h.map(h=>`<th>${h}</th>`).join('')}</tr>${c.r.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</table></div>${c.tip?`<div class="tip">💡 ${c.tip}</div>`:''}</div>`).join('')};
const drawT=()=>{const f=$('#ts').value.toLowerCase();$('#tl').innerHTML=DATA.terms.filter(t=>(tc==='All'||t[0]===tc)&&(t[1]+' '+t[2]).toLowerCase().includes(f)).map(t=>`<div class="term"><div class="e">${t[1]} <small>· ${t[0]}</small></div><div>${t[2]}</div></div>`).join('')||'<div class="sub">مفيش نتيجة</div>'};
mk($('#cp'),cats,c=>CN[c]||c,c=>{cc=c;drawC()});mk($('#tp'),tcats,c=>c,c=>{tc=c;drawT()});
$('#ts').oninput=drawT;drawC();drawT();
show(location.hash.slice(1)||'summary');
</script>
</body>
